id: subscription
name: Subscription
kind: entity
status: defined
definition: >
  A customer's standing agreement to receive deliveries on a plan and be
  charged for each billing interval until they cancel.
discouraged_terms:
  - {term: membership, note: "Used on the marketing site"}
relations:
  - {type: related_to, target: subscription-plan}
  - {type: has, target: subscription-started, cardinality: "1:1"}
  - {type: has, target: subscription-cancelled, cardinality: "1:1"}
implemented_in:
  - path: models/marts/fct_subscriptions.sql
    symbol: subscription_id
open_questions:
  - "Is a paused subscription still a subscription for reporting purposes?"
