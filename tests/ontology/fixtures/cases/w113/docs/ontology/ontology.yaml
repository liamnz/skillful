schema_version: 1
name: Baseline
description: A small, valid ontology used as the test baseline.

extensions:
  kinds:
    channel:
      status: defined
      definition: >
        A deliberately plain extension kind used only to push the count of kinds past eight.
    region_kind:
      status: defined
      definition: >
        A deliberately plain extension kind used only to push the count of kinds past eight.
    tier:
      status: defined
      definition: >
        A deliberately plain extension kind used only to push the count of kinds past eight.
    season:
      status: defined
      definition: >
        A deliberately plain extension kind used only to push the count of kinds past eight.
    promo:
      status: defined
      definition: >
        A deliberately plain extension kind used only to push the count of kinds past eight.
  relation_types:
    placed_by:
      status: defined
      definition: >
        The source order or ordering event was initiated by the target
        customer, who is responsible for paying for it.
      inverse: places
      from: [entity, event]
      to: [entity]
    measures:
      status: defined
      definition: >
        The source metric is computed from instances of the target and
        summarises some aspect of them.
      inverse: measured_by
      from: [metric]
      to: [entity, event]

settings:
  stale_proposal_days: 30
  min_definition_words: 8
  drift_context_lines: 3
